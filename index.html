<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>许成龙</title>
<style>
  :root { --ink:#14161a; --sub:#7c828c; --line:#e6e8ec; --accent:#8a6a3f; --paper:#fbfaf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
         line-height:1.7; }
  .wrap { max-width:680px; margin:0 auto; padding:64px 24px 80px; }
  .mark { width:34px; height:2px; background:var(--accent); margin-bottom:30px; }
  h1 { font-size:36px; margin:0 0 12px; letter-spacing:-.4px; }
  .lead { color:var(--sub); font-size:15px; margin:0 0 52px; }
  h2 { font-size:14px; font-weight:600; color:var(--sub); letter-spacing:.6px;
       margin:0 0 14px; text-transform:uppercase; }
  ul { list-style:none; margin:0 0 48px; padding:0; }
  li { border-top:1px solid var(--line); }
  li:last-child { border-bottom:1px solid var(--line); }
  a.item { display:flex; justify-content:space-between; align-items:baseline; gap:16px;
           padding:17px 4px; color:inherit; text-decoration:none; }
  a.item:hover { background:#fff; }
  .t { font-size:16px; }
  .d { color:var(--sub); font-size:13px; white-space:nowrap; }
  footer { color:var(--sub); font-size:13px; border-top:1px solid var(--line); padding-top:18px; }
  @media (max-width:520px) { h1 { font-size:29px; } .wrap { padding:44px 18px 60px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <h1>许成龙</h1>
  <p class="lead">这里放我做的东西</p>

  <h2>作品</h2>
  <ul>
    <li><a class="item" href="portfolio.html">
      <span class="t">AI 视觉作品集</span><span class="d">电商主图 · 场景合成 · 短视频</span></a></li>
  </ul>

  <footer>
    联系：小红书「一张图工作室」（5510280920）　／　邮箱 2795680146 # qq.com
  </footer>
</div>
</body>
</html>
