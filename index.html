<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>许成龙 · AI 视觉作品集</title>
<style>
  :root { --ink:#14161a; --sub:#7c828c; --line:#e6e8ec; --accent:#8a6a3f; --paper:#fbfaf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
         line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 24px 72px; }
  .mark { width:34px; height:2px; background:var(--accent); margin-bottom:28px; }
  h1 { font-size:34px; margin:0 0 10px; letter-spacing:-.4px; }
  .lead { color:var(--sub); margin:0 0 8px; font-size:15px; }
  .tags { color:var(--sub); font-size:13px; letter-spacing:.3px; margin:0 0 40px; }
  h2 { font-size:14px; font-weight:600; color:var(--sub); letter-spacing:.6px;
       margin:0 0 14px; text-transform:uppercase; }
  ul { list-style:none; margin:0 0 44px; padding:0; }
  li { border-top:1px solid var(--line); }
  li:last-child { border-bottom:1px solid var(--line); }
  a.item { display:flex; justify-content:space-between; align-items:baseline; gap:16px;
           padding:16px 4px; color:inherit; text-decoration:none; }
  a.item:hover { background:#fff; }
  .t { font-size:16px; }
  .d { color:var(--sub); font-size:13px; white-space:nowrap; }
  footer { color:var(--sub); font-size:13px; border-top:1px solid var(--line); padding-top:18px; }
  @media (max-width:520px) { h1 { font-size:28px; } .wrap { padding:40px 18px 56px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <h1>许成龙</h1>
  <p class="lead">AI 视觉 · 电商主图 · 短视频</p>
  <p class="tags">ComfyUI 出图 ／ 场景合成 ／ 产品图调色 ／ 剪辑与转码</p>

  <h2>作品集</h2>
  <ul>
    <li><a class="item" href="ai-visual-portfolio.pdf">
      <span class="t">AI 视觉作品集</span><span class="d">PDF · 建议先看这份</span></a></li>
    <li><a class="item" href="outpainting-sweater.pdf">
      <span class="t">出图作品集 · 毛衣系列</span><span class="d">PDF</span></a></li>
    <li><a class="item" href="outpainting-full.pdf">
      <span class="t">出图作品集 · 完整版</span><span class="d">PDF · 约 12 MB</span></a></li>
  </ul>

  <footer>
    联系：<span id="contact">（待填）</span>
  </footer>
</div>
</body>
</html>
